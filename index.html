<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>My Car Log</title>
  <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <script>try{var t=localStorage.getItem("carlog.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Car Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@500;600;700&display=swap">
  <style>
:root {
  /* Graphite & cyan, light version (dark version below) */
  color-scheme: light;
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eef1f4;
  --line: #dee3e8;
  --text: #111317;
  --text-2: #3e4650;
  --muted: #6b7682;
  --accent: #0b98b8;
  --accent-ink: #ffffff;
  --danger: #d64545;
  --ok: #1f9d5f;
  --fuel: #0b98b8;
  --service: #c97f0b;
  --expense: #7b5ce0;
  --rego: #d0457a;
  --tyre: #5d6b7c;
  --grid: #e6eaee;
  --tabbar: #ffffff;
  --glow: rgba(11, 152, 184, .25);
  --radius: 14px;
  --tabs-h: 64px;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Sora", "DM Sans", system-ui, -apple-system, sans-serif;
}
/* Dark: follows the phone's setting unless Light is chosen in Garage */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #111317;
  --surface: #1a1e23;
  --surface-2: #22272e;
  --line: #2a3038;
  --text: #f1f3f5;
  --text-2: #c2c9d2;
  --muted: #8b95a1;
  --accent: #16c2e2;
  --accent-ink: #071318;
  --danger: #f06a6a;
  --ok: #2bb673;
  --fuel: #0ea5c6;
  --service: #c67f0b;
  --expense: #8c6fe6;
  --rego: #ec6b9c;
  --tyre: #7d8ea3;
  --grid: #23282f;
  --tabbar: #15181c;
  --glow: rgba(22, 194, 226, .28);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111317;
  --surface: #1a1e23;
  --surface-2: #22272e;
  --line: #2a3038;
  --text: #f1f3f5;
  --text-2: #c2c9d2;
  --muted: #8b95a1;
  --accent: #16c2e2;
  --accent-ink: #071318;
  --danger: #f06a6a;
  --ok: #2bb673;
  --fuel: #0ea5c6;
  --service: #c67f0b;
  --expense: #8c6fe6;
  --rego: #ec6b9c;
  --tyre: #7d8ea3;
  --grid: #23282f;
  --tabbar: #15181c;
  --glow: rgba(22, 194, 226, .28);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 1.1rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* Buttons & inputs */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font: inherit; font-weight: 600; padding: .7rem 1rem;
  border-radius: 10px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.wide { width: 100%; }
.btn.small { padding: .4rem .7rem; font-size: .9rem; }
.btn:disabled { opacity: .5; }
.link { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: .25rem; }
label { display: grid; gap: .3rem; font-size: .85rem; color: var(--text-2); font-weight: 600; }
input, select, textarea {
  font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: .65rem .75rem; width: 100%;
  font-weight: 400;
}
textarea { min-height: 4.5rem; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.check { display: flex; align-items: center; gap: .6rem; font-weight: 500; color: var(--text); font-size: .95rem; }
.check input { width: 1.2rem; height: 1.2rem; }
.stack { display: grid; gap: .8rem; }
.row { display: flex; gap: .6rem; }
.grow { flex: 1; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .8rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }

/* Auth */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 420px; display: grid; gap: 1rem; text-align: center; }
.auth-card form { text-align: left; }
.auth-logo { width: 72px; height: 72px; margin: 0 auto; border-radius: 18px; }
.or { display: flex; align-items: center; gap: .8rem; color: var(--muted); font-size: .85rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.msg { min-height: 1.2em; color: var(--danger); margin: 0; font-size: .9rem; }

/* App shell */
.topbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: .6rem;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar select { font-weight: 700; font-size: 1.05rem; border: 0; background: transparent; padding: .3rem 0; width: auto; max-width: 100%; flex: 1; }
.sync { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.sync.offline { background: var(--muted); }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(var(--tabs-h) + 90px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  height: var(--tabs-h); background: none; border: 0; color: var(--muted); font: inherit; font-size: .75rem;
  font-weight: 600; display: grid; place-items: center; align-content: center; gap: 3px; cursor: pointer;
}
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.active { color: var(--accent); }
.fab {
  position: fixed; right: 16px; bottom: calc(var(--tabs-h) + 16px + env(safe-area-inset-bottom)); z-index: 7;
  width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  font-size: 2rem; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer;
}

/* Cards & stats */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card h2 { margin-bottom: .75rem; }
.hero { display: grid; gap: .2rem; }
.hero .big { font-size: 2.2rem; font-weight: 750; letter-spacing: -.02em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat .v { font-size: 1.3rem; font-weight: 700; }
.stat .k { font-size: .8rem; color: var(--muted); font-weight: 600; }
.split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: .6rem 0 .5rem; background: var(--surface); }
.split span { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .85rem; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .35rem; vertical-align: -1px; }

/* Entry list */
.list { display: grid; }
.entry {
  display: grid; grid-template-columns: 36px 1fr auto; gap: .75rem; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0;
  color: inherit; font: inherit; text-align: left; width: 100%; cursor: pointer;
}
.entry:last-child { border-bottom: 0; }
.badge { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.badge svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.badge.fuel { background: var(--fuel); }
.badge.service { background: var(--service); }
.badge.expense { background: var(--expense); }
.badge.rego { background: var(--rego); }
.badge.tyres { background: var(--tyre); }
.entry .t { font-weight: 650; }
.entry .s { font-size: .82rem; color: var(--muted); }
.entry .amt { font-weight: 700; text-align: right; }
.month-head { font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 14px 0 2px; display: flex; justify-content: space-between; }
.chips { display: flex; gap: .4rem; overflow-x: auto; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: .4rem .85rem; font: inherit; font-size: .9rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.empty { text-align: center; padding: 2rem 1rem; color: var(--muted); }

/* Charts */
.chart-box { position: relative; height: 230px; }
.chart-note { font-size: .82rem; color: var(--muted); margin-top: .5rem; }

/* Garage */
.vehicle { display: flex; justify-content: space-between; align-items: center; gap: .6rem; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vehicle:last-child { border-bottom: 0; }

/* Sheet (dialog) */
.sheet {
  border: 0; padding: 0; width: 100%; max-width: 560px; max-height: 92vh; margin: auto auto 0;
  border-radius: 18px 18px 0 0; background: var(--bg); color: var(--text);
}
@media (min-width: 600px) { .sheet { margin: auto; border-radius: 18px; } }
.sheet::backdrop { background: rgba(0,0,0,.45); }
.sheet form { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: .9rem; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; color: var(--text-2); font: inherit; font-weight: 650; padding: .5rem; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.hint { font-size: .8rem; color: var(--muted); margin-top: -.4rem; }
.hint.warn { color: var(--service); }
.receipt { display: flex; gap: .75rem; align-items: center; }
.receipt img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.receipt-full { width: 100%; border-radius: 10px; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 90px); transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: .6rem 1rem; border-radius: 10px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: .2s; z-index: 20; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%); }

/* Banner artwork (sign-in screen and top of Home) */
.banner { display: block; width: 100%; height: auto; aspect-ratio: 8 / 3; object-fit: cover; border-radius: var(--radius); background: #0a1d3a; }

/* Typography: Sora for headings and the numbers that matter, DM Sans for everything else */
h1, h2, h3, .hero .big, .stat .v, .entry .amt, .month-head .num, .topbar select, .sheet-head h2 {
  font-family: var(--font-display);
}
h2 { font-weight: 600; letter-spacing: -.01em; }
.hero .big { font-weight: 700; letter-spacing: -.03em; }
.stat .v { font-weight: 600; letter-spacing: -.02em; }
.entry .amt { font-weight: 600; }
.topbar select { font-weight: 600; letter-spacing: -.01em; }
.btn, .chip, .tabs button, .seg button, input, select, textarea { font-family: var(--font-body); }

/* Graphite & cyan finishing touches */
.fab { box-shadow: 0 8px 22px var(--glow), 0 2px 6px rgba(0, 0, 0, .35); }
.tabs { background: var(--tabbar); }
.tabs button.active { color: var(--accent); }
.btn.primary { box-shadow: 0 4px 14px var(--glow); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
.toast { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
input:focus, select:focus, textarea:focus { outline-color: var(--accent); }

/* Appearance switch in Garage */
.seg.theme { grid-template-columns: repeat(3, 1fr); }
.seg.theme button.on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }

/* Home: the banner runs edge to edge, joins the top bar, and fades into the page */
@media (max-width: 1023px) {
html.brand-top .topbar { background: transparent; border-bottom-color: transparent; }
html.brand-top .topbar::before { opacity: 1; }
html.brand-top .topbar select { color: #ffffff; }
html.brand-top .topbar select option { color: initial; }
}
.hero-banner {
  position: relative;
  margin: -16px -16px 0;
}
.hero-banner img { display: block; width: 100%; height: auto; aspect-ratio: 8 / 3; object-fit: cover; }
.hero-banner::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 38%;
  background: linear-gradient(to bottom, transparent, var(--bg));
  pointer-events: none;
}
.hero-banner + .hero { margin-top: -30px; position: relative; z-index: 1; }
@media (min-width: 672px) {
  /* On wider screens the content column is narrower than the screen: round the banner instead */
  .hero-banner { margin: 0; border-radius: var(--radius); overflow: hidden; }
}

/* Dashboard: period switch, trend arrows, breakdown tables */
.chips.period { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; overflow: visible; }
.chips.period .chip { padding: .45rem .2rem; font-size: .82rem; text-align: center; background: var(--surface); }
.chips.period .chip.on { background: var(--accent); }
.hero-banner + .chips.period { margin-top: -34px; position: relative; z-index: 1; }
.hero-delta { display: flex; align-items: baseline; gap: .4rem; flex-wrap: wrap; }
.delta { font-size: .8rem; font-weight: 700; white-space: nowrap; }
.delta.good { color: var(--ok); }
.delta.bad { color: var(--danger); }
.delta.flat { color: var(--muted); }
.stats { grid-template-columns: 1fr 1fr; }
.stat .d { display: flex; gap: .4rem; align-items: baseline; flex-wrap: wrap; min-height: 1.1rem; margin-top: 2px; font-size: .78rem; }
.svc h2 { margin-bottom: .4rem; }
.svc p { margin: 0 0 .25rem; }
.svc-big { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.svc-due { color: var(--accent); font-weight: 600; margin-top: .5rem !important; }
.svc-due.over { color: var(--danger); }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th, .tbl td { padding: .55rem .4rem; text-align: right; white-space: nowrap; }
.tbl thead th { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tbl tbody th { text-align: left; font-family: var(--font-display); font-weight: 600; }
.tbl tbody tr + tr th, .tbl tbody tr + tr td { border-top: 1px solid var(--line); }
.tbl tr.now th, .tbl tr.now td { color: var(--accent); }
.tbl tr.future td, .tbl tr.future th { color: var(--muted); }
.tbl td:first-of-type { text-align: right; }
.so-far { font-family: var(--font-body); font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }

/* Vehicle buttons across the top bar: one tap to switch */
.vtabs { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.vtabs::-webkit-scrollbar { display: none; }
.vtab {
  flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--text-2);
  border-radius: 999px; padding: .45rem .95rem; font: 600 .92rem var(--font-display); letter-spacing: -.01em;
  white-space: nowrap; cursor: pointer;
}
.vtab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.vtabs-empty { font: 600 1.05rem var(--font-display); }
@media (max-width: 1023px) {
html.brand-top .vtab { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .28); color: #ffffff; }
html.brand-top .vtab.on { background: #ffffff; color: #062b5d; border-color: #ffffff; }
html.brand-top .vtabs-empty { color: #ffffff; }
}

/* ---------- Add / edit entry ---------- */
:root { --ease: cubic-bezier(.2, .8, .2, 1); }
.sheet[open] { animation: sheet-in .42s var(--ease); }
.sheet[open]::backdrop { animation: fade-in .3s ease; }
@keyframes sheet-in { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.kinds {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
  transition: grid-template-columns .5s var(--ease), gap .5s var(--ease);
}
.kinds.picked { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.kind {
  appearance: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 18px; padding: 16px 14px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  text-align: left; font: inherit; cursor: pointer; min-width: 0;
  transition: padding .5s var(--ease), border-color .3s ease, background-color .3s ease, opacity .3s ease, transform .18s ease, gap .5s var(--ease);
}
.kind:active { transform: scale(.96); }
.kind:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kind .ic {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: var(--k);
  box-shadow: 0 6px 16px color-mix(in srgb, var(--k) 35%, transparent);
  transition: width .5s var(--ease), height .5s var(--ease), border-radius .5s var(--ease), box-shadow .3s ease;
}
.kind .ic svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: width .5s var(--ease), height .5s var(--ease); }
.kind .nm { font: 600 1.08rem var(--font-display); letter-spacing: -.01em; transition: font-size .5s var(--ease); }
.kind .ds { font-size: .8rem; line-height: 1.3; color: var(--muted); max-height: 3.2em; overflow: hidden; transition: max-height .4s var(--ease), opacity .25s ease; }
.kinds.picked .kind { padding: 10px 4px; align-items: center; gap: 6px; text-align: center; }
.kinds.picked .kind .ic { width: 34px; height: 34px; border-radius: 10px; box-shadow: none; }
.kinds.picked .kind .ic svg { width: 18px; height: 18px; }
.kinds.picked .kind .nm { font-size: .82rem; }
.kinds.picked .kind .ds { max-height: 0; opacity: 0; }
.kinds.picked .kind:not(.on) { opacity: .55; }
.kind.on { border-color: var(--k); background: color-mix(in srgb, var(--k) 14%, var(--surface)); }
.kinds.picked .kind.on .ic { box-shadow: 0 4px 12px color-mix(in srgb, var(--k) 40%, transparent); }

.fields-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .55s var(--ease); }
.fields-wrap.open { grid-template-rows: 1fr; }
.fields-inner { min-height: 0; overflow: hidden; display: grid; gap: .9rem; padding: 2px; margin: -2px; }
.fields-wrap.open .fi { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + 120ms); }
.fields-wrap.no-anim .fi { animation: none; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.fi { display: grid; gap: .9rem; }
.fi .hint { margin-top: -.5rem; }

.field-label { font-size: .85rem; color: var(--text-2); font-weight: 600; margin-bottom: -.4rem; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: block; cursor: pointer; }
.pill input { position: absolute; opacity: 0; pointer-events: none; }
.pill span {
  display: inline-block; padding: .55rem .9rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface);
  color: var(--text); font-weight: 600; font-size: .9rem; transition: background-color .25s ease, border-color .25s ease, color .25s ease;
}

/* Coming up: service, tyres, rego, insurance */

.rem { display: grid; grid-template-columns: 38px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }

.st-ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.st-soon { color: var(--service); background: color-mix(in srgb, var(--service) 16%, transparent); }
.st-due { color: var(--danger); background: color-mix(in srgb, var(--danger) 15%, transparent); }

/* ---------- Layout groups (single column on phones) ---------- */
.dash-grid, .dash-main, .dash-side, .dash-tables, .charts-grid, .garage-grid { display: grid; gap: 16px; align-content: start; min-width: 0; }

@media (min-width: 1440px) {

/* Mouse users get hover feedback */

}

/* Feels like an app: no pinch or double-tap zoom */
html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
button, a, label, input, select, textarea { touch-action: manipulation; }

/* Several jobs in one entry */
.kind { position: relative; }
.kind .tick {
  position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--k); opacity: 0; transform: scale(.4); transition: opacity .25s ease, transform .3s var(--ease);
}

.kinds-hint { margin: -2px 0 0; font-size: .8rem; color: var(--muted); text-align: center; }
.part { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface) 60%, transparent); }
.part-head { display: flex; align-items: center; gap: 8px; font: 600 .95rem var(--font-display); margin-bottom: -.2rem; }
.part-ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--k); }

.badge-stack { display: grid; grid-auto-flow: column; justify-content: start; }
.badge-stack .badge + .badge { margin-left: -14px; box-shadow: 0 0 0 2px var(--surface); }
.entry:has(.badge-stack) { grid-template-columns: auto 1fr auto; }
.entry .badge-stack .badge { width: 36px; height: 36px; }

/* Tyres: several jobs, position picker, and the corner-by-corner map */
.pill input[type=checkbox] { position: absolute; opacity: 0; pointer-events: none; }
.pills.small .pill span { padding: .45rem .75rem; font-size: .84rem; }
.reveal { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
.reveal.open { grid-template-rows: 1fr; }
.reveal-in { min-height: 0; overflow: hidden; display: grid; gap: .8rem; opacity: 0; transition: opacity .3s ease; padding: 2px; margin: -2px; }
.reveal.open .reveal-in { opacity: 1; transition-delay: .1s; }
.tyre-pick, .tyremap { display: grid; grid-template-columns: 1fr 64px 1fr; grid-template-rows: auto auto; gap: 10px; align-items: stretch; }
.tyre-pick .tp-car, .tyremap .tm-car { grid-column: 2; grid-row: 1 / span 2; display: grid; place-items: center; color: var(--muted); }
.tp-car svg, .tm-car svg { width: 54px; height: auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.tp-FL, .tm-FL { grid-column: 1; grid-row: 1; } .tp-FR, .tm-FR { grid-column: 3; grid-row: 1; }
.tp-RL, .tm-RL { grid-column: 1; grid-row: 2; } .tp-RR, .tm-RR { grid-column: 3; grid-row: 2; }
.tp {
  appearance: none; border: 1.5px dashed var(--line); background: var(--surface); color: var(--text-2); border-radius: 14px;
  min-height: 62px; font: 600 .85rem var(--font-body); cursor: pointer; display: grid; place-items: center;
  transition: background-color .25s ease, border-color .25s ease, color .25s ease, transform .15s ease;
}
.tp:active { transform: scale(.96); }
.tp.on { border-style: solid; border-color: var(--tyre); background: var(--tyre); color: #fff; }

.tm.newest { border-color: var(--accent); }

.tm-pos { font-size: .7rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* Garage: merge places */
.places-tabs { margin-bottom: .4rem; }
.places-tabs button { font-size: .85rem; padding: .5rem .3rem; }
.place-list { display: grid; max-height: 340px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.place-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--text); font-size: .95rem; font-weight: 500; cursor: pointer; }

.place-row input { width: 1.15rem; height: 1.15rem; margin: 0; accent-color: var(--accent); }
.place-row .pn { min-width: 0; overflow-wrap: anywhere; }
.place-actions { margin-top: .8rem; }
.pills.accent .pill input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- Motion ---------- */
:root { --spring: cubic-bezier(.3, 1.2, .4, 1); }

/* Content fades up when you change screens, and softly when you change vehicle or filter */
main.anim-view > * { animation: view-in .5s var(--ease) both; animation-delay: calc(var(--n, 0) * 45ms); }

@keyframes view-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* Spending bar segments glide to their new sizes */
.split span { transition: flex-grow .65s var(--ease); }
.legend b { font-weight: inherit; }

/* Top bar fades between plain and the blue banner colour */
.topbar { isolation: isolate; transition: background-color .4s ease, border-color .4s ease; }
.topbar::before {
  content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; pointer-events: none;
  background: linear-gradient(90deg, #062b5d 0%, #034487 50%, #013672 100%); transition: opacity .45s ease;
}
@media (min-width: 1024px) { html.brand-top .topbar::before { opacity: 0; } }

/* Sliding selection pill */
.has-ind { isolation: isolate; }
.vtabs.has-ind, .chips.has-ind, .seg.has-ind { position: relative; }
.has-ind > .ind {
  position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; border-radius: 999px; background: var(--accent);
  transition: transform .5s var(--spring), width .5s var(--spring), height .5s var(--spring), background-color .4s ease;
}
.has-ind > :not(.ind) { position: relative; z-index: 1; }
.has-ind > .on, .has-ind > .active { background: transparent !important; border-color: transparent !important; box-shadow: none !important; }

/* Vehicle buttons and filters sit in one rounded track */
.vtabs, .chips { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; }
.vtabs { flex: 0 1 auto; margin-right: auto; }
.vtab, .chip { background: transparent; border-color: transparent; transition: color .3s ease, filter .2s ease; }
.vtab.on, .chip.on { color: var(--accent-ink); }
.chips.period { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); gap: 2px; }
.chips.period .chip { background: transparent; }
@media (max-width: 1023px) {
  html.brand-top .vtabs { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .24); }
  html.brand-top .vtabs > .ind { background: #ffffff; }
  html.brand-top .vtab { background: transparent; border-color: transparent; color: #ffffff; }
  html.brand-top .vtab.on { color: #062b5d; }
}

/* Switches (Appearance, Places) */
.seg > .ind { border-radius: 8px; background: var(--surface); box-shadow: 0 1px 4px rgba(0, 0, 0, .22); }
.seg.theme > .ind { background: var(--accent); }
.seg button { transition: color .3s ease; }

/* Tab bar: a short bar slides above the active tab; on desktop a soft highlight */
.tabs > .ind { border-radius: 0 0 3px 3px; }
.tabs button { transition: color .3s ease; }
.tabs button svg { transition: transform .35s var(--spring); }
.tabs button.active svg { transform: translateY(-1px) scale(1.08); }
@media (min-width: 1024px) {
  .tabs > .ind { border-radius: 12px; background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .tabs button.active svg { transform: none; }
}

/* Panels slide away when closed */
.sheet.closing { animation: sheet-out .26s cubic-bezier(.4, 0, 1, 1) forwards; }
.sheet.closing::backdrop { animation: fade-out .26s ease forwards; }
@keyframes sheet-out { to { transform: translateY(36px); opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }

/* Buttons give a little under the finger */
.btn, .chip, .vtab, .qpick, .tp, .entry { transition: transform .15s ease, filter .2s ease, background-color .25s ease, border-color .25s ease, color .3s ease; }
.btn:active, .chip:active, .vtab:active, .entry:active { transform: scale(.97); }

@media (prefers-reduced-motion: reduce) {

}

/* Rego / insurance countdown */
.countdown strong { font-size: 1.35rem; line-height: 1; margin-right: .15rem; }

/* Tyre wear: km done vs expected life */
.tm-bar { display: block; height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--muted) 22%, transparent); overflow: hidden; margin: 5px 0 2px; }
.tm-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .65s var(--ease); }
.tm-left { font-size: .76rem; font-weight: 600; color: var(--text-2); }
.tm-soon { border-color: var(--service); } .tm-soon .tm-bar i { background: var(--service); }
.tm-due { border-color: var(--danger); } .tm-due .tm-bar i { background: var(--danger); } .tm-due .tm-left { color: var(--danger); }
.tyremap { grid-template-columns: 1fr 44px 1fr; gap: 8px; }
.tyremap .tm-car svg { width: 40px; }
.tm-age { font-size: .92rem; letter-spacing: -.01em; }

/* Tyre rings */
.tyrerings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 2px; }
.tr { display: flex; gap: 9px; align-items: center; min-width: 0; }

.tr circle { fill: none; stroke-width: 5; }
.tr-track { stroke: color-mix(in srgb, var(--muted) 24%, transparent); }
.tr-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .7s var(--ease); }
.tr-soon .tr-fill { stroke: var(--service); } .tr-soon .tr-v { color: var(--service); }
.tr-due .tr-fill { stroke: var(--danger); } .tr-due .tr-v { color: var(--danger); }
.tr-k { font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-v { font: 600 .9rem var(--font-display); }

/* Tyre wear: car picture with coloured wheels */
.tyrewear { display: grid; grid-template-columns: minmax(0,1fr) 70px minmax(0,1fr); grid-template-rows: auto auto; column-gap: 10px; row-gap: 22px; align-items: center; margin: 4px 0 2px; }
.tw-car { grid-column: 2; grid-row: 1 / span 2; width: 70px; height: auto; }
.tw-car rect { transition: fill .6s ease; }
.tw-car .tw-none { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; }
.tw-body { fill: var(--surface-2, var(--bg)); stroke: var(--muted); stroke-width: 2; }
.tw-glass { fill: color-mix(in srgb, var(--muted) 22%, transparent); stroke: var(--muted); stroke-width: 1.5; stroke-linejoin: round; }
.tw-l { display: grid; gap: 1px; min-width: 0; }
.tw-left { text-align: right; justify-items: end; }
.tw-k { font-size: .66rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tw-v { font: 600 .92rem var(--font-display); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tw-v i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tw-left .tw-v { flex-direction: row-reverse; }
.tw-s { font-size: .74rem; color: var(--muted); }
.tw-scale { position: relative; height: 8px; border-radius: 999px; margin-top: 6px;
  background: linear-gradient(90deg, rgb(34,177,76), rgb(110,192,58), rgb(176,204,44), rgb(240,196,28), rgb(244,150,34), rgb(236,104,42), rgb(220,56,56)); }
.tw-scale b { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .6s var(--ease); }
.tw-ends { display: flex; justify-content: space-between; font-size: .68rem; color: var(--muted); margin-top: -2px; }
.tw-guide summary { cursor: pointer; color: var(--accent); font-size: .78rem; font-weight: 600; list-style: none; width: max-content; }
.tw-guide summary::-webkit-details-marker { display: none; }
.tw-guide summary::after { content: "\00a0\25BE"; } .tw-guide[open] summary::after { content: "\00a0\25B4"; }
.tw-guide ul { list-style: none; margin: 8px 0 6px; padding: 0; display: grid; gap: 5px; font-size: .82rem; }
.tw-guide li { display: grid; grid-template-columns: 12px 1fr auto 74px; gap: 8px; align-items: center; }
.tw-guide li i { width: 12px; height: 12px; border-radius: 4px; }
.tw-guide .tw-when { text-align: right; color: var(--text-2); font-size: .76rem; }
.rem-tyremap .rem-body { min-width: 0; overflow: hidden; padding-right: 2px; }

/* Tyres: car with coloured wheels, km done in a ring by each corner */
.tyrecar { display: grid; grid-template-columns: minmax(0,1fr) 58px minmax(0,1fr); grid-template-rows: auto auto; column-gap: 8px; row-gap: 26px; align-items: center; margin: 2px 0; }
.tyrecar .tw-car { grid-column: 2; grid-row: 1 / span 2; width: 58px; height: auto; }
.tc { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tc-left { flex-direction: row-reverse; text-align: right; }
.tc svg { flex: none; width: 34px; height: 34px; }
.tc circle { fill: none; stroke-width: 5; }
.tc-t { display: grid; min-width: 0; }
.tc .tr-v { font-size: .88rem; white-space: nowrap; }
.tc .tr-k { font-size: .62rem; }
.tw-car rect { transition: fill .6s ease; }
.tw-car .tw-none { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; }
.vehicle-form .tw-guide, form .tw-guide { margin: -.2rem 0 .2rem; }
.tyrecar { grid-template-columns: minmax(0,1fr) 64px minmax(0,1fr); row-gap: 14px; column-gap: 6px; }
.tyrecar .tw-car { width: 64px; }
.tc, .tc-left { flex-direction: column; gap: 4px; text-align: center; }
.tc svg { width: 40px; height: 40px; }
.tc .tr-v { font-size: .86rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Five kinds on the add screen: fuel across the top, then two by two */
.kinds:not(.picked) .kind[data-kind="fuel"] { grid-column: 1 / -1; }
.kinds.picked { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.kinds.picked .kind .nm { font-size: .74rem; line-height: 1.15; }
.kind .nm-s { display: none; }
.kinds.picked .kind .nm-l { display: none; } .kinds.picked .kind .nm-s { display: inline; }
.chips[data-ind-key="log"] .chip { padding-left: 11px; padding-right: 11px; }

/* Wear bar in the tyre colours (wipers) */
.wear-bar { display: block; height: 8px; border-radius: 999px; margin: 7px 0 3px; background: color-mix(in srgb, var(--muted) 22%, transparent); overflow: hidden; }
.wear-bar i { display: block; height: 100%; border-radius: inherit; background-image: linear-gradient(90deg, rgb(34,177,76), rgb(110,192,58), rgb(176,204,44), rgb(240,196,28), rgb(244,150,34), rgb(236,104,42), rgb(220,56,56)); background-repeat: no-repeat; transition: width .7s var(--ease); }

/* Keep fields inside their columns on iPhone (date boxes are wider than their column by default) */
label { min-width: 0; }
input, select, textarea { min-width: 0; max-width: 100%; box-sizing: border-box; }
input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-height: calc(1.5em + 1.3rem + 2px); text-align: left; line-height: 1.5; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
input[type="date"]::-webkit-calendar-picker-indicator { margin-left: 0; }
/* Wiper bar: full colour scale with a marker for where you're up to */
.wear-bar { position: relative; overflow: visible; height: 8px; margin: 10px 7px 6px;
  background: linear-gradient(90deg, rgb(34,177,76), rgb(110,192,58), rgb(176,204,44), rgb(240,196,28), rgb(244,150,34), rgb(236,104,42), rgb(220,56,56)); }
.wear-bar b { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--text), 0 1px 4px rgba(0,0,0,.35); transition: left .7s var(--ease); }
.wear-bar { margin-left: 11px; margin-right: 11px; }

.stats .stat.wide { grid-column: 1 / -1; }

/* Rego / insurance paid */
.pay-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 4px; }
.pay-btn { background: var(--rego); color: #fff; border: 0; font-weight: 600; }
.paid-ok { font-weight: 700; color: var(--ok, #1f9d55); font-size: .8rem; }
.paid-next { margin: 0; font-size: .95rem; }

/* Tyres: outer ring = tyre life, inner ring = rotation */
.tc svg { width: 52px; height: 52px; }
.tc circle.outer { stroke-width: 5.5; }
.tc circle.inner { stroke-width: 4.5; }
.rot-head { display: grid; gap: 1px; margin: 2px 0 8px; }
.rot-k { font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.rot-v { font: 700 1.6rem/1.1 var(--font-display); letter-spacing: -.01em; }
.rot-s { font-size: .82rem; color: var(--text-2); }
.ring-key { display: flex; justify-content: center; gap: 16px; font-size: .74rem; color: var(--muted); margin-top: 8px; }
.ring-key span { display: inline-flex; align-items: center; gap: 6px; }
.ring-key i { width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--muted); }
.ring-key .k-inner { width: 8px; height: 8px; border-width: 2.5px; }
.tc .tr-total { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.tc circle.outer { stroke-width: 7; }
.tc circle.inner { stroke-width: 3; }
.ring-key .k-outer { border-width: 4px; }
.ring-key .k-inner { border-width: 1.5px; }

/* Spending pie in the main card */
.hero-top { display: flex; align-items: center; gap: 14px; }
.hero-text { display: grid; gap: .2rem; flex: 1; min-width: 0; }
.pie { flex: none; width: 118px; height: 118px; }
.pie path { stroke: var(--surface); stroke-width: 1.6; stroke-linejoin: round; }
.hero .legend { margin-top: .7rem; }
.legend em { font-style: normal; color: var(--muted); font-size: .78rem; }
.hero .split { display: none; }

/* Charts: stat cards */
.cstats { display: grid; gap: 16px; grid-column: 1 / -1; min-width: 0; }
@media (min-width: 760px) { .cstats { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; } }
.cs-card h2 { display: flex; align-items: center; gap: 10px; margin-bottom: .4rem; }
.cs-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.cs-ic svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cs-odo .cs-ic { background: var(--tyre); }
.cs-cost .cs-ic { background: var(--service); }
.cs-econ .cs-ic { background: var(--fuel); }
.cs-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: .55rem 0; border-top: 1px solid var(--line); }
.cs-row:first-of-type { border-top: 0; }
.cs-k { color: var(--text-2); font-size: .9rem; }
.cs-v { font: 600 .98rem var(--font-display); text-align: right; white-space: nowrap; }
.cs-v small { display: block; font: 400 .74rem var(--font-body); color: var(--muted); }
.cs-period { margin: -4px 0 0; grid-column: 1 / -1; }
#app-charts-chips, .view-charts .chips.period { margin-bottom: 4px; }

/* Charts: empty message sits over the chart area */
.chart-box { position: relative; }
.chart-empty { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 0 16px; text-align: center; color: var(--muted); font-size: .88rem; background: color-mix(in srgb, var(--surface) 75%, transparent); border-radius: 10px; }
#cat-box { transition: height .5s var(--ease); }

/* Charts: period buttons follow you down the page */
.chips.period.sticky-period { position: sticky; top: calc(var(--topbar-h, 60px) + 8px); z-index: 4; align-self: start;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .28); background: color-mix(in srgb, var(--surface) 82%, transparent); }
.chips.period.sticky-period { background: color-mix(in srgb, var(--surface) 95%, transparent); }
@media (min-width: 1024px) { .chips.period.sticky-period { justify-self: start; } }
/* Keep the main card the same height between periods so nothing below it jumps */
.hero-top { min-height: 118px; }
.hero-delta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero .legend { min-height: 3.1em; align-content: start; }

/* Scan docket */
.scan-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; align-items: center; padding: 12px; border: 1.5px dashed color-mix(in srgb, var(--fuel) 55%, var(--line)); border-radius: 14px; background: color-mix(in srgb, var(--fuel) 7%, transparent); }
.scan-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--fuel); color: #fff; border: 0; font-weight: 600; white-space: nowrap; cursor: pointer; }
.scan-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.scan-btn.busy { opacity: .7; pointer-events: none; }
.scan-status { font-size: .82rem; color: var(--text-2); line-height: 1.35; }
.scan-status.ok { color: var(--ok); font-weight: 600; }
.scan-status.warn { color: var(--service); font-weight: 600; }
.scan-bar { grid-column: 1 / -1; display: block; height: 4px; border-radius: 999px; background: color-mix(in srgb, var(--muted) 25%, transparent); overflow: hidden; }
.scan-bar i { display: block; height: 100%; width: 5%; background: var(--fuel); border-radius: inherit; transition: width .3s ease; }
input.scanned { animation: scanned 1.6s ease; }
@keyframes scanned { 0%, 40% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--fuel) 45%, transparent); border-color: var(--fuel); } 100% { box-shadow: none; } }

/* ---------- Car tab ---------- */
.car-grid { display: grid; gap: 16px; min-width: 0; }
@media (min-width: 1024px) { .car-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } .car-view { position: sticky; top: calc(var(--topbar-h, 60px) + 16px); } }
.car-view { padding: 10px; display: grid; gap: 10px; }
.car3d { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 62vh; border-radius: 14px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 35%, color-mix(in srgb, var(--accent) 16%, var(--surface)) 0%, var(--surface) 70%); }
.car3d canvas { display: block; width: 100% !important; height: 100% !important; cursor: grab; }
.car3d canvas:active { cursor: grabbing; }
.car-hint { position: absolute; left: 12px; top: 10px; font-size: .74rem; color: var(--muted); pointer-events: none; z-index: 1; }
.car-fail { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; color: var(--muted); font-size: .9rem; text-align: center; padding: 16px; }
.car-key { display: flex; align-items: center; gap: 8px; font-size: .72rem; color: var(--muted); padding: 0 6px; }
.car-key i { flex: 1; max-width: 160px; height: 6px; border-radius: 999px; background: linear-gradient(90deg, rgb(34,177,76), rgb(176,204,44), rgb(240,196,28), rgb(244,150,34), rgb(220,56,56)); }
.ck-none { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; }
.ck-none b { width: 10px; height: 10px; border-radius: 50%; background: #6b7682; }
.part-detail { padding: 6px 8px 4px; display: grid; gap: 6px; }
.part-detail.empty { color: var(--muted); font-size: .88rem; padding: 6px 8px 8px; }
.pd-top { display: flex; align-items: center; gap: 10px; font: 600 1.05rem var(--font-display); }
.pd-top .st { margin-left: auto; }
.pd-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.pd-main { font-size: .92rem; }
.pd-sub { font-size: .8rem; color: var(--muted); }
.pd-hist { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; font-size: .84rem; }
.pd-hist li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.pd-hist li span:nth-child(2) { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pd-hist .link { padding: 0; font-weight: 600; font-size: .84rem; }
.pd-add { justify-self: start; margin-top: 4px; }
.car-list { display: grid; gap: 2px; }
.car-list h2 { margin-bottom: 6px; }
.part-row { appearance: none; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-radius: 12px; padding: 10px 8px; color: var(--text); font: inherit; cursor: pointer; transition: background-color .25s ease; }
.part-row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.part-row.on { background: color-mix(in srgb, var(--accent) 13%, transparent); }
.pr-t { display: grid; flex: 1; min-width: 0; }
.pr-n { font-weight: 600; }
.pr-s { font-size: .78rem; color: var(--muted); }
.pr-bar { width: 64px; height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--muted) 22%, transparent); overflow: hidden; flex: none; }
.pr-bar i { display: block; height: 100%; border-radius: inherit; }
.parts-more summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .88rem; padding: 10px 8px; list-style: none; }
.parts-more summary::-webkit-details-marker { display: none; }
.parts-pick .pill span { font-size: .8rem; }
.tabs button { font-size: .7rem; }
.part-tag { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; padding: 5px 10px; border-radius: 999px; background: var(--text); color: var(--bg); font: 600 .78rem var(--font-display); white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.3); animation: tag-in .35s var(--ease) both; }
.part-tag::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; z-index: -1; }
@keyframes tag-in { from { opacity: 0; margin-top: 6px; } to { opacity: 1; margin-top: 0; } }

/* Vehicle shape picker */
.shape-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.shape-tile { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 4px 6px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; font-weight: 600; font-size: .78rem; color: var(--text-2); transition: border-color .2s, background-color .2s, color .2s; }
.shape-tile input { position: absolute; opacity: 0; pointer-events: none; }
.shape-tile svg { width: 100%; max-width: 104px; height: auto; }
.shape-tile:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); color: var(--text); }
.sb { fill: color-mix(in srgb, var(--accent) 18%, transparent); stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; }
.ss { stroke: var(--accent); stroke-width: 1.2; opacity: .6; }
.sw { fill: var(--text-2); stroke: var(--surface); stroke-width: 1.5; }
.car-shape { position: absolute; right: 10px; top: 8px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--text-2); font: 600 .74rem var(--font-body); cursor: pointer; }
.car-shape svg { width: 38px; height: auto; }

/* Panels: fixed in place, only scroll up and down inside */
html.sheet-open, html.sheet-open body { overflow: hidden; }
html.sheet-open body { position: fixed; left: 0; right: 0; width: 100%; }
.sheet { overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; max-width: min(560px, 100vw); }
.sheet form { max-width: 100%; overflow-x: clip; }
.sheet::backdrop { touch-action: none; }

/* Rotation pattern picker: animated car, flick through */
.rot-pick { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.rot-mid { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.rot-mid.slide-l { animation: rot-l .35s var(--ease); } .rot-mid.slide-r { animation: rot-r .35s var(--ease); }
@keyframes rot-l { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes rot-r { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
.rot-svg { width: 120px; height: auto; }
.rot-body { fill: var(--surface-2, var(--bg)); stroke: var(--line); stroke-width: 1.5; }
.rot-svg rect:not(.rot-body) { fill: var(--accent); }
.rot-mv { transform-box: view-box; animation: rot-move 2.6s ease-in-out infinite; }
@keyframes rot-move { 0%, 15% { transform: translate(0, 0); } 55%, 85% { transform: translate(var(--dx), var(--dy)); } 100% { transform: translate(0, 0); } }
.rot-name { font: 600 1rem var(--font-display); }
.rot-desc { font-size: .8rem; color: var(--muted); max-width: 30ch; }
.rot-dots { display: flex; gap: 6px; margin-top: 2px; }
.rot-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background-color .2s; }
.rot-dots i.on { background: var(--accent); }
.rot-nav { appearance: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--text-2); font-size: 1.4rem; line-height: 1; cursor: pointer; }
.rot-nav:active { transform: scale(.94); }
@media (prefers-reduced-motion: reduce) { .rot-mv, .rot-mid.slide-l, .rot-mid.slide-r { animation: none; } }

/* Tyre jobs: grouped tick boxes with a short explanation */
.tyre-jobs { display: grid; gap: 10px; }
.tj-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tj-g { grid-column: 1 / -1; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.tj { position: relative; display: grid; gap: 1px; padding: 9px 10px 9px 34px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; transition: border-color .2s, background-color .2s; min-width: 0; }
.tj input { position: absolute; opacity: 0; pointer-events: none; }
.tj::before { content: ""; position: absolute; left: 10px; top: 11px; width: 16px; height: 16px; border-radius: 5px; border: 2px solid var(--line); transition: background-color .2s, border-color .2s; }
.tj:has(input:checked) { border-color: var(--tyre); background: color-mix(in srgb, var(--tyre) 14%, var(--surface)); }
.tj:has(input:checked)::before { background: var(--tyre); border-color: var(--tyre); box-shadow: inset 0 0 0 2px var(--surface); }
.tj-n { font-weight: 600; font-size: .9rem; color: var(--text); }
.tj-d { font-size: .74rem; color: var(--muted); line-height: 1.3; }
.tj { align-content: start; }
.tj-rot { grid-column: 1 / -1; } .tj-rot .reveal-in { display: grid; gap: 8px; padding-top: 4px; }

/* Service type: two big buttons */
.svc-type { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.svc-opt { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 12px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; transition: border-color .2s, background-color .2s; }
.svc-opt input { position: absolute; opacity: 0; pointer-events: none; }
.svc-ic { grid-row: 1 / span 2; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--service) 18%, transparent); color: var(--service); transition: background-color .2s, color .2s; }
.svc-ic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.svc-n { font-weight: 700; font-size: .95rem; }
.svc-d { font-size: .74rem; color: var(--muted); line-height: 1.25; }
.svc-opt:has(input:checked) { border-color: var(--service); background: color-mix(in srgb, var(--service) 12%, var(--surface)); }
.svc-opt:has(input:checked) .svc-ic { background: var(--service); color: #fff; }
.svc-opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill.flash span { animation: pill-flash .7s ease; }
@keyframes pill-flash { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* Tyre jobs: compact rows of buttons */
.tyre-jobs { gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.tj-group { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 0 8px; align-items: center; padding: 7px 10px; border-top: 1px solid var(--line); }
.tj-group:first-child { border-top: 0; }
.tj-g { grid-column: auto; margin: 0; font-size: .64rem; }
.tj-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tj { padding: 6px 12px; border-radius: 999px; border-width: 1.5px; background: var(--bg); }
.tj::before { display: none; }
.tj-n { font-size: .84rem; white-space: nowrap; }
.tj:has(input:checked) { background: var(--tyre); border-color: var(--tyre); }
.tj:has(input:checked) .tj-n { color: #fff; }
.tj-rot { grid-column: 1 / -1; }
.tj-rot .reveal-in { padding-top: 8px; }
/* Smaller position pickers and rotation car */
#tyre-new-box .tyre-pick, #tyre-fix-box .tyre-pick { max-width: 300px; margin: 0 auto; grid-template-columns: 1fr 48px 1fr; gap: 6px; }
#tyre-new-box .tp, #tyre-fix-box .tp { min-height: 40px; padding: 6px; font-size: .8rem; }
#tyre-new-box .tp-car svg, #tyre-fix-box .tp-car svg { width: 30px; }
.rot-svg { width: 84px; }
.rot-pick { padding: 6px 4px; grid-template-columns: 40px minmax(0, 1fr) 40px; }
.rot-nav { width: 40px; height: 40px; }
.rot-name { font-size: .92rem; }
.rot-desc { font-size: .76rem; }
.tj:has(input:checked) { background: var(--accent); border-color: var(--accent); }
.tj:has(input:checked) .tj-n { color: var(--accent-ink); }
.tj-rot .field-label { font-size: .8rem; margin-bottom: 6px; }
.tj-rot .tp-quick { justify-content: center; margin-top: 6px; }
.tj-rot .hint { text-align: center; margin-top: 4px; }

/* Tyre position picker: top-down car like the rotation picker */
.tyre-pick2 { display: grid; justify-items: center; gap: 4px; padding: 6px 0 2px; }
.tyre-pick2 .rot-svg { width: 104px; }
.tp-nose { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; opacity: .6; }
.tp2 { cursor: pointer; outline: none; }
.tp-hit { fill: transparent; }
.tp-t { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 3; transition: fill .2s, stroke .2s; }
.tp2:hover .tp-t, .tp2:focus-visible .tp-t { stroke: var(--accent); }
.tp2.on .tp-t { fill: var(--accent); stroke: var(--accent); stroke-dasharray: none; }
.tp-names { font-size: .82rem; font-weight: 600; color: var(--text-2); text-align: center; min-height: 1.2em; }
.tyre-pick2 .rot-svg rect.tp-hit { fill: transparent; }
.tyre-pick2 .rot-svg rect.tp-t { fill: none; }
.tyre-pick2 .rot-svg .tp2.on rect.tp-t { fill: var(--accent); }

/* Tyre swap animation: old tyre slides off, new one rolls on */
.tyre-pick2 .rot-svg rect.tp-old { fill: color-mix(in srgb, var(--muted) 35%, transparent); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.tyre-pick2 .rot-svg rect.tp-t { fill: var(--accent); stroke: none; }
.tp-tread { stroke: color-mix(in srgb, var(--accent-ink) 55%, transparent); stroke-width: 1.6; stroke-linecap: round; }
